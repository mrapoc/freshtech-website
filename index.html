    <!-- Analytics (GA4 + Microsoft Clarity) — consent-gated for UK GDPR / PECR.
         Nothing loads and no cookies are set until the visitor opts in via the
         cookie banner. window.ftLoadAnalytics() is called by the banner on
         "Accept", and auto-fires here on load for returning visitors who have
         already consented. Once armed, the scripts still defer to first
         interaction (or a short timeout) to protect LCP. Stored consent is
         re-checked at the moment of loading, and window.ftCancelAnalytics()
         disarms a pending load. Unreadable or unwritable storage counts as
         no consent. -->
    <script type="text/javascript">
      (function() {
        var GA_ID = 'G-XB492EFNKW';
        var CLARITY_ID = 'urhwe2bbi1';
        var CONSENT_KEY = 'ft-cookie-consent-v1';
        var armed = false;
        var loaded = false;
        var disarm = null;

        // True only when an opt-in is stored AND storage is writable. If the
        // visitor could not record a withdrawal, an old opt-in must not count.
        function storedConsent() {
          try {
            var stored = JSON.parse(localStorage.getItem(CONSENT_KEY) || 'null');
            if (!(stored && stored.analytics === true)) return false;
            localStorage.setItem(CONSENT_KEY + ':probe', '1');
            localStorage.removeItem(CONSENT_KEY + ':probe');
            return true;
          } catch (e) {
            return false;
          }
        }

        function loadGA() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(script);
          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', GA_ID);
        }

        function loadClarity() {
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", CLARITY_ID);
        }

        // Arms interaction/timeout-based loading. Idempotent. Only ever called
        // once consent for analytics exists, and consent is re-read from
        // storage immediately before the vendor scripts are added.
        window.ftLoadAnalytics = function() {
          if (armed || loaded) return;
          armed = true;
          var events = ['click', 'scroll', 'touchstart', 'keydown'];
          var timer = setTimeout(fire, 3000);
          function cleanup() {
            clearTimeout(timer);
            events.forEach(function(e) {
              document.removeEventListener(e, fire, { capture: true });
            });
            armed = false;
            disarm = null;
          }
          function fire() {
            cleanup();
            if (!storedConsent()) return;
            loaded = true;
            loadGA();
            loadClarity();
          }
          events.forEach(function(e) {
            document.addEventListener(e, fire, { passive: true, capture: true });
          });
          disarm = cleanup;
        };

        // Cancels a pending load. Returns true when the vendor scripts have
        // already been added to the page, so the caller can reload with the
        // stored denial to stop further collection.
        window.ftCancelAnalytics = function() {
          if (disarm) disarm();
          return loaded;
        };

        // Auto-arm only for visitors who have already opted in.
        if (storedConsent()) window.ftLoadAnalytics();
      })();
    </script>
