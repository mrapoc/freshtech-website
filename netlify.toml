# Netlify Configuration File
# Place this in the root of your repository

[build]
  publish = "dist"
  # Notify IndexNow engines about newly published pages. Google discovers ordinary
  # pages through the sitemap; its Indexing API is limited to eligible job/live-video pages.
  # Keep IndexNow failures non-fatal so notification issues do not fail deployment.
  command = "npm run build && (node scripts/indexnow-submit.mjs --new-vs-live || true)"

# Staging deploys (branch + deploy preview) get X-Robots-Tag: noindex
# via the strip-trailing-slash edge function, which already runs on /*.
# context.*.headers blocks in this file proved unreliable for this case.

# Install Playwright browsers inside node_modules so Netlify's dependency
# cache also caches them. Required by scripts/prerender.js (Chromium).
[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Disable Pretty URLs (trailing slash addition) to prevent redirect loops
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------
# 0. Edge Functions
# ---------------------------------------------------------
# Strip trailing slashes (301) to prevent duplicate canonical URLs in GSC.
# Edge function runs before redirects, so no conflict with SPA fallback.
[[edge_functions]]
  function = "strip-trailing-slash"
  path = "/*"

