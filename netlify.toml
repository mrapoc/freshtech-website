# ---------------------------------------------------------
# 2. Trailing Slash Normalization (via Edge Function)
# ---------------------------------------------------------
# Generic placeholder redirects (/:path1/) cause loops on Netlify because
# the trailing slash is treated as optional. Using an edge function instead.
# See netlify/edge-functions/strip-trailing-slash.ts

# ---------------------------------------------------------
# 3. SPA Fallback (Critical for React Router)
# ---------------------------------------------------------
# This rule tells Netlify to serve index.html for any path
# that doesn't match a static file (images, css, etc).
# This allows React Router to handle the URL.
# Preserve the former client-only industry aliases on static hosting.
[[redirects]]
  from = "/industries/engineering"
  to = "/industries/manufacturing"
  status = 301
  force = true

[[redirects]]
  from = "/industries/legal"
  to = "/industries/solicitors"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------
# 4. Security Headers
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS - Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy - Tightened with explicit domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://cdn.tailwindcss.com https://esm.sh https://assets.calendly.com https://hq.fresh-tech.uk; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com https://c.clarity.ms https://c.bing.com https://res.cloudinary.com https://ui-avatars.com https://registry.blockmarktech.com blob:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://www.clarity.ms https://*.clarity.ms https://*.netlify.app https://helpdesk.fresh-tech.uk https://calendly.com https://hq.fresh-tech.uk https://dns.google; frame-src https://calendly.com https://registry.blockmarktech.com https://hq.fresh-tech.uk https://maps.google.com https://www.google.com; frame-ancestors 'none'; media-src 'self' https://res.cloudinary.com; object-src 'none'; base-uri 'self'; form-action 'self' https://calendly.com; upgrade-insecure-requests;"

# ---------------------------------------------------------
# 5. Performance Caching
# ---------------------------------------------------------
# Vite generates files with hashes (e.g. index.a3b2c1.js).
# We can cache these forever because if the content changes, the hash changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Do not cache index.html so users always get the latest version info
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
